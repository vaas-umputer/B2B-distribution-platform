server:
  # See tenant-catalog-service's application.yml for why this is PORT-driven.
  port: ${PORT:8082}

spring:
  application:
    name: order-inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_user}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

jwt:
  secret: ${JWT_SECRET:phase1-dev-only-shared-signing-secret-CHANGE-ME-before-prod}

credit-service:
  url: ${CREDIT_SERVICE_URL:http://localhost:8083}
invoice-service:
  url: ${INVOICE_SERVICE_URL:http://localhost:8084}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
