server:
  port: 8084

spring:
  application:
    name: invoice-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_user}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

system:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_db}
    username: ${SYSTEM_DB_USER:svc_system}
    password: ${SYSTEM_DB_PASSWORD:svc_system}

invoice:
  overdue-sweep:
    cron: ${OVERDUE_SWEEP_CRON:0 0 2 * * *}

jwt:
  secret: ${JWT_SECRET:phase1-dev-only-shared-signing-secret-CHANGE-ME-before-prod}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
