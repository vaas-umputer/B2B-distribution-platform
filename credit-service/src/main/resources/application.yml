server:
  # See tenant-catalog-service's application.yml for why this is PORT-driven.
  port: ${PORT:8083}

spring:
  application:
    name: credit-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_user}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
        default-requeue-rejected: false # after retries are exhausted, reject (routes to the DLQ) instead of requeuing forever

system:
  # ?options=-c%20app.admin_mode%3Dtrue sets the app.admin_mode GUC on
  # every connection this pool opens (pgjdbc's "options" param is passed
  # straight through as libpq -c flags) - see the admin-bypass RLS
  # policies (V5 migration) and infra/postgres-init's Javadoc for why this
  # replaces BYPASSRLS. Safe to leave on for the pool's whole lifetime:
  # this DataSource is used ONLY for genuinely cross-tenant admin reads,
  # never shared with the RLS-enforced app_user pool above.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit_db}?options=-c%20app.admin_mode%3Dtrue
    username: ${SYSTEM_DB_USER:svc_system}
    password: ${SYSTEM_DB_PASSWORD:svc_system}

credit:
  new-agent-ceiling: ${NEW_AGENT_CEILING:1500000}
  near-limit-alert:
    cron: ${NEAR_LIMIT_ALERT_CRON:0 */15 * * * *}
  monthly-review:
    cron: ${MONTHLY_REVIEW_CRON:0 0 0 1 * *}

jwt:
  secret: ${JWT_SECRET:phase1-dev-only-shared-signing-secret-CHANGE-ME-before-prod}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
